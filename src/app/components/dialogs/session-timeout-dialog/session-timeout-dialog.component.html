<h2 mat-dialog-title>Are you still there?</h2>

<mat-dialog-content>
  <p>Your session is about to expire due to inactivity.</p>
  <p>
    You will be logged out in <strong>{{ remainingSeconds }}</strong> seconds.
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button color="warn" (click)="logoutNow()">Logout</button>
  <button mat-flat-button color="primary" (click)="stayLoggedIn()">Stay</button>
</mat-dialog-actions>
